[package]
name = "kronvox-desktop"
version = "0.1.0"
description = "KRONVOX desktop — unbox-and-go virtual phone for AI agents"
authors = ["KRONVOX"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
futures-util = "0.3"
zip = "2"
roxmltree = "0.20"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
